# Cada 5 min pide al monitor que revise los negocios y avise por ntfy si alguno cambió de estado.
name: Revisar negocios
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 30 --retry 2 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://pagovoz-monitor.vercel.app/api/check
